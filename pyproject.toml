[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keywharf"
dynamic = ["version"]
description = "Manage local SSH config alongside a remote key repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "keywharf" }]
license = { text = "MIT" }
keywords = ["ssh", "automation", "cli", "configuration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
keywharf = "keywharf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["keywharf*"]

[tool.setuptools.package-data]
keywharf = ["config_defaults/**/*.json", "templates/**/*.json", "templates/**/*.j2"]

[tool.setuptools.dynamic]
version = {attr = "keywharf.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
