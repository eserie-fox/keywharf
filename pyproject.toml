[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keywharf"
dynamic = ["version"]
description = "Manage local SSH config from a workspace and host repo."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "keywharf" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ssh", "automation", "cli", "configuration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "GitPython>=3.1.59,<4",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "rich>=13.8",
    "typer>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.8",
]

[project.scripts]
keywharf = "keywharf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["keywharf*"]

[tool.setuptools.package-data]
keywharf = ["config_defaults/**/*.json", "templates/**/*.json", "templates/**/*.j2"]

[tool.setuptools.dynamic]
version = {attr = "keywharf.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["keywharf"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
