name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Set deterministic build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct \"$GITHUB_SHA\")" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          package_version=$(python -c "import runpy; print(runpy.run_path('src/keywharf/version.py')['__version__'])")
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag/version mismatch: tag is ${GITHUB_REF_NAME}, expected ${expected_tag}" >&2
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Record exact artifact hashes
        run: sha256sum dist/* > artifact-sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: |
            dist/
            artifact-sha256.txt
          if-no-files-found: error

  publish-to-pypi:
    name: Publish tag artifact to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/keywharf/
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions

      - name: Verify exact build artifact handoff
        run: sha256sum --check artifact-sha256.txt

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
